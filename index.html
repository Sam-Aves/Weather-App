<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f7fb">
  <title>Atmos — Weather, at a glance</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --page: #f3f6fb;
      --card: rgba(255, 255, 255, .78);
      --solid-card: #fff;
      --ink: #17253a;
      --muted: #7b899d;
      --line: rgba(37, 57, 84, .09);
      --accent: #d7a2b4;
      --accent-soft: #f8eaf0;
      --weather-ambient: hsla(34, 48%, 78%, .16);
      --weather-glow: hsla(34, 48%, 78%, .28);
      --nav-hue: 266;
      --shadow: 0 24px 70px rgba(50, 71, 104, .10);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        --page: #111a27;
        --card: rgba(29, 42, 59, .82);
        --solid-card: #1d2a3b;
        --ink: #f1f5fb;
        --muted: #9aa9bc;
        --line: rgba(225, 235, 248, .09);
        --shadow: 0 24px 70px rgba(0, 0, 0, .24);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --page: #111a27;
      --card: rgba(29, 42, 59, .82);
      --solid-card: #1d2a3b;
      --ink: #f1f5fb;
      --muted: #9aa9bc;
      --line: rgba(225, 235, 248, .09);
      --shadow: 0 24px 70px rgba(0, 0, 0, .24);
      color-scheme: dark;
    }
    :root[data-theme="light"] { color-scheme: light; }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--page); scroll-behavior: smooth; }
    body {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-width: 0;
      min-height: 100vh;
      margin: 0;
      padding: clamp(24px, 5vw, 48px) clamp(12px, 3vw, 24px);
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% -15%, var(--weather-ambient), transparent 47%),
        transparent;
      font-size: 15px;
      line-height: 1.5;
      transition: color .35s ease, background-color .35s ease;
    }
    #weather-canvas {
      position: fixed;
      z-index: -1;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    .app { position: relative; z-index: 1; width: min(100%, 760px); margin: 0 auto; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 750; letter-spacing: -.04em; }
    .brand-mark {
      position: relative;
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      color: #fff;
      background: linear-gradient(145deg, #e8c7dd, #f2cfb5);
      border-radius: 14px;
      box-shadow: 0 6px 16px rgba(205, 160, 183, .2);
    }
    .brand-mark svg { width: 32px; height: 32px; overflow: visible; }
    .logo-sun-rays { transform-origin: 20px 17px; animation: logo-sun-spin 28s linear infinite; }
    .logo-sun-disc { transform-origin: 20px 17px; animation: logo-sun-breathe 3.8s ease-in-out infinite; }
    .logo-cloud { transform-origin: 23px 29px; animation: logo-cloud-drift 4s ease-in-out infinite; }
    @keyframes logo-sun-spin { to { transform: rotate(360deg); } }
    @keyframes logo-sun-breathe { 50% { transform: scale(1.08); } }
    @keyframes logo-cloud-drift { 50% { transform: translateY(-1.5px); } }
    .top-note { color: var(--muted); font-size: 13px; }
    .topbar-actions { display: flex; align-items: center; gap: 12px; }
    .weather-nav {
      position: sticky;
      z-index: 5;
      top: 12px;
      display: flex;
      justify-content: space-around;
      gap: 5px;
      margin: -7px 0 18px;
      padding: 6px;
      background: hsla(var(--nav-hue) 46% 91% / .86);
      border: 1px solid var(--line);
      border-radius: 17px;
      box-shadow: 0 10px 30px rgba(48, 54, 87, .10);
      backdrop-filter: blur(18px) saturate(1.3);
      transition: background-color .65s ease, border-color .35s ease, box-shadow .35s ease;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) .weather-nav { background: hsla(var(--nav-hue) 25% 24% / .9); }
    }
    :root[data-theme="dark"] .weather-nav { background: hsla(var(--nav-hue) 25% 24% / .9); }
    .weather-nav a {
      flex: 1;
      min-width: 0;
      min-height: 44px;
      display: grid;
      place-items: center;
      padding: 8px 10px;
      color: var(--muted);
      border-radius: 11px;
      font-size: 12px;
      font-weight: 650;
      text-align: center;
      text-decoration: none;
      transition: color .2s ease, background .25s ease, transform .2s ease;
    }
    .weather-nav a:hover { color: var(--ink); background: var(--card); transform: translateY(-1px); }
    .weather-nav a[aria-current="location"] { color: var(--ink); background: var(--card); box-shadow: 0 3px 10px rgba(35, 43, 68, .08); }
    .weather-nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .theme-toggle {
      display: grid;
      width: 44px;
      height: 44px;
      flex: none;
      place-items: center;
      color: var(--ink);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 13px;
      box-shadow: 0 5px 15px rgba(40, 60, 90, .06);
      cursor: pointer;
      transition: background .35s ease, color .35s ease, border-color .35s ease, transform .2s ease;
    }
    .theme-toggle:hover { color: var(--accent); transform: translateY(-2px); }
    .theme-toggle:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .theme-toggle svg { width: 19px; height: 19px; }
    .theme-toggle .moon-icon { display: none; }
    :root[data-theme="dark"] .theme-toggle .sun-icon { display: none; }
    :root[data-theme="dark"] .theme-toggle .moon-icon { display: block; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) .theme-toggle .sun-icon { display: none; }
      :root:not([data-theme]) .theme-toggle .moon-icon { display: block; }
    }
    .search-wrap { position: relative; margin-bottom: 18px; }
    .search {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 5px 6px 5px 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 17px;
      box-shadow: 0 8px 24px rgba(40, 60, 90, .04);
      backdrop-filter: blur(14px);
    }
    .search svg { flex: none; width: 19px; color: var(--muted); }
    .search input {
      width: 100%;
      min-width: 0;
      padding: 9px 0;
      color: var(--ink);
      background: transparent;
      border: 0;
      outline: 0;
      font-size: 14px;
    }
    .search input::placeholder { color: var(--muted); opacity: .85; }
    .search button {
      flex: none;
      min-height: 44px;
      padding: 9px 17px;
      color: #44394d;
      background: #eadced;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
      transition: transform .18s ease, opacity .18s ease, box-shadow .18s ease;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) .search button { color: #2f2938; background: #e6cce1; }
    }
    :root[data-theme="dark"] .search button { color: #2f2938; background: #e6cce1; }
    .search button:hover { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(205, 160, 183, .25); }
    .search button:active, .city-chip:active, .theme-toggle:active { transform: scale(.96); }
    .search button:disabled { cursor: wait; opacity: .65; }
    .search button:focus-visible, .city-chip:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .status { min-height: 20px; margin: 0 4px 8px; color: var(--muted); font-size: 12px; }
    .status.error { color: #c65e50; }
    .city-picker { margin: -8px 2px 13px; }
    .city-picker-label { display: block; margin-bottom: 7px; color: var(--muted); font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; }
    .city-chips { display: flex; gap: 7px; overflow-x: auto; padding: 2px 1px 6px; scrollbar-width: none; }
    .city-chips[hidden] { display: none; }
    .city-chips::-webkit-scrollbar { display: none; }
    .city-chip {
      flex: none;
      min-height: 40px;
      padding: 7px 13px;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      backdrop-filter: blur(12px);
      transition: transform .18s ease, color .2s ease, border-color .2s ease, background .2s ease, box-shadow .2s ease;
    }
    .city-chip:hover, .city-chip[aria-current="true"] {
      color: var(--ink);
      background: var(--accent-soft);
      border-color: var(--accent);
      box-shadow: 0 4px 12px var(--weather-glow);
      transform: translateY(-1px);
    }
    .recent-cities:empty { display: none; }
    .weather-card {
      position: relative;
      overflow: hidden;
      padding: 25px 26px 23px;
      background:
        radial-gradient(ellipse at 89% 21%, var(--weather-glow), transparent 34%),
        var(--card);
      border: 1px solid var(--line);
      border-radius: 25px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      transition: background .45s ease, color .35s ease, border-color .35s ease, box-shadow .35s ease, transform .25s ease;
    }
    .weather-card:hover { box-shadow: 0 28px 78px rgba(50, 71, 104, .14); transform: translateY(-2px); }
    .weather-card.forecast-selected { animation: forecast-reveal .55s ease-out; }
    @keyframes forecast-reveal {
      35% { box-shadow: 0 0 0 4px var(--weather-glow), 0 28px 78px rgba(50, 71, 104, .17); }
      100% { box-shadow: var(--shadow); }
    }
    .place-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .eyebrow { margin: 0 0 5px; color: var(--muted); font-size: 12px; font-weight: 650; letter-spacing: .11em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -.045em; }
    .date { margin-top: 3px; color: var(--muted); font-size: 13px; }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 9px;
      color: #56836a;
      background: rgba(95, 176, 120, .11);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .live-badge::before { width: 6px; height: 6px; background: currentColor; border-radius: 50%; content: ""; }
    .temperature-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 18px 0 14px; }
    .temperature { display: flex; align-items: flex-start; font-size: clamp(76px, 19vw, 102px); font-weight: 650; letter-spacing: -.095em; line-height: .95; }
    .temperature .degree { margin: 9px 0 0 4px; font-size: 36px; font-weight: 450; letter-spacing: -.06em; }
    .condition { margin-top: 12px; color: var(--muted); font-size: 15px; }
    .wardrobe-tip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: 100%;
      margin: 1px 0 15px;
      padding: 8px 12px;
      color: var(--ink);
      background: linear-gradient(110deg, var(--accent-soft), var(--card));
      border: 1px solid var(--line);
      border-radius: 999px;
      box-shadow: 0 5px 18px var(--weather-glow);
      font-size: 12px;
      font-weight: 600;
      backdrop-filter: blur(12px);
    }
    .wardrobe-tip-icon { font-size: 15px; }
    .weather-icon {
      width: 112px;
      height: 112px;
      flex: none;
      margin-right: 4px;
      color: var(--accent);
      filter: drop-shadow(0 8px 14px color-mix(in srgb, var(--accent) 25%, transparent));
      transition: color .5s ease, filter .5s ease;
    }
    .weather-icon svg { width: 100%; height: 100%; }
    .weather-icon.sun svg, .weather-icon.partly svg { animation: icon-float 4.5s ease-in-out infinite; }
    .weather-icon.sun svg circle, .weather-icon.partly svg circle { transform-box: fill-box; transform-origin: center; animation: icon-sun-pulse 3.2s ease-in-out infinite; }
    .weather-icon.cloud svg, .weather-icon.fog svg { animation: icon-float 5s ease-in-out infinite; }
    .weather-icon.rain svg, .weather-icon.snow svg, .weather-icon.storm svg { animation: icon-weather-drift 2.8s ease-in-out infinite; }
    @keyframes icon-float { 50% { transform: translateY(-5px); } }
    @keyframes icon-sun-pulse { 50% { opacity: .72; transform: scale(1.08); } }
    @keyframes icon-weather-drift { 50% { transform: translateY(3px); } }
    #current-weather, #hourly-section, #forecast-section { scroll-margin-top: 82px; }
    .summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 0 2px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }
    .summary strong { color: var(--ink); font-weight: 650; }
    .section-heading { display: flex; align-items: baseline; justify-content: space-between; margin: 25px 2px 12px; }
    .section-heading h2 { margin: 0; font-size: 16px; letter-spacing: -.02em; }
    .section-heading span { color: var(--muted); font-size: 12px; }
    .hourly-forecast {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 3px 2px 12px;
      scroll-behavior: smooth;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .hourly-forecast::-webkit-scrollbar { display: none; }
    .hour-card {
      display: flex;
      min-height: 124px;
      flex: 0 0 76px;
      flex-direction: column;
      align-items: center;
      padding: 11px 6px 10px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 17px;
      box-shadow: 0 8px 24px rgba(40, 60, 90, .035);
      scroll-snap-align: start;
      backdrop-filter: blur(12px);
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease, background .35s ease;
    }
    .hour-card:hover, .hour-card:focus-visible { transform: translateY(-3px) scale(1.025); border-color: var(--accent); box-shadow: 0 12px 28px var(--weather-glow); }
    .hour-card:focus-visible, .day:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .hour-card:active, .day:active { transform: scale(.97); }
    .hour-card:hover .hour-icon svg, .hour-card:focus-visible .hour-icon svg,
    .day:hover .day-icon svg, .day:focus-visible .day-icon svg { filter: drop-shadow(0 3px 5px var(--weather-glow)); transform: scale(1.12) translateY(-1px); }
    .hour-card[aria-pressed="true"], .day[aria-pressed="true"] {
      background: linear-gradient(155deg, var(--accent-soft), var(--card) 76%);
      border-color: var(--accent);
      box-shadow: 0 8px 24px var(--weather-glow), inset 0 0 0 1px var(--accent);
    }
    .hour-card[aria-pressed="true"]::before, .day[aria-pressed="true"]::before {
      position: absolute;
      top: 0;
      left: 50%;
      width: 25px;
      height: 3px;
      background: var(--accent);
      border-radius: 0 0 4px 4px;
      content: "";
      transform: translateX(-50%);
    }
    .hour-time { color: var(--muted); font-size: 11px; font-weight: 650; }
    .hour-icon { display: grid; height: 47px; place-items: center; color: var(--accent); }
    .hour-icon svg { width: 34px; height: 34px; transition: transform .2s ease, filter .2s ease; }
    .hour-temp { padding: 1px 7px; color: var(--ink); background: var(--accent-soft); border-radius: 999px; font-size: 13px; font-weight: 700; }
    .forecast { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
    .day {
      position: relative;
      overflow: hidden;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      min-height: 137px;
      padding: 13px 5px 12px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 17px;
      box-shadow: 0 8px 24px rgba(40, 60, 90, .035);
      backdrop-filter: blur(12px);
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease, background .35s ease;
    }
    .day:hover { border-color: var(--accent); box-shadow: 0 12px 28px var(--weather-glow); transform: translateY(-3px); }
    .day-name { color: var(--muted); font-size: 11px; font-weight: 650; }
    .day-icon { display: grid; height: 42px; place-items: center; margin: 4px 0; color: var(--accent); }
    .day-icon svg { width: 34px; height: 34px; transition: transform .2s ease, filter .2s ease; }
    .day-temps { display: flex; justify-content: center; gap: 5px; font-size: 12px; font-weight: 700; }
    .day-temps > span:first-child { color: var(--accent); }
    .day-temps .low { color: var(--muted); font-weight: 500; }
    .day-condition { overflow: hidden; margin-top: 4px; color: var(--muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .footer { margin: 19px 0 0; color: var(--muted); font-size: 11px; text-align: center; }
    .footer a { color: inherit; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (max-width: 600px) {
      body { padding: 22px 12px; }
      .app { width: 100%; }
      .topbar { gap: 8px; margin-bottom: 18px; }
      .brand { gap: 8px; }
      .topbar-actions { gap: 8px; }
      .top-note { max-width: 145px; font-size: 11px; text-align: right; }
      .weather-nav { top: 6px; margin-bottom: 15px; }
      .weather-nav a { padding-inline: 5px; font-size: 11px; }
      .search { gap: 8px; padding-left: 12px; }
      .search button { padding-inline: 12px; }
      .weather-card { padding: 21px 19px 19px; }
      .weather-icon { width: 84px; height: 84px; }
      .temperature { font-size: clamp(68px, 20vw, 88px); }
      .forecast {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 3px 2px 12px;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .forecast::-webkit-scrollbar { display: none; }
      .day { min-width: 84px; min-height: 130px; flex: 0 0 84px; padding-inline: 5px; scroll-snap-align: start; }
      .day-condition { font-size: 9px; }
      .wardrobe-tip { font-size: 11px; }
    }
    @media (max-width: 340px) {
      body { padding-inline: 9px; }
      .brand-mark { width: 36px; height: 36px; }
      .brand-mark svg { width: 29px; height: 29px; }
      .top-note { max-width: 112px; font-size: 10px; }
      .weather-nav { gap: 2px; padding: 4px; }
      .weather-nav a { font-size: 10px; }
      .weather-card { padding: 18px 15px 16px; }
      .weather-icon { width: 72px; height: 72px; }
      .temperature { font-size: 64px; }
      .temperature .degree { margin-top: 7px; font-size: 28px; }
      .summary { gap: 5px; font-size: 11px; }
      .wardrobe-tip { gap: 6px; padding: 7px 9px; font-size: 10px; }
    }
    @media (min-width: 700px) {
      .app { width: min(100%, 760px); }
      .weather-card { padding: 30px 34px 26px; }
      .temperature-row { padding-block: 22px 18px; }
      .forecast { gap: 12px; }
      .day { min-height: 148px; padding: 16px 10px 13px; }
      .day-condition { font-size: 11px; }
    }
    @media (min-width: 1100px) {
      body { padding-top: 54px; }
      .app { width: min(100%, 820px); }
      .weather-card { border-radius: 30px; }
      .weather-nav { top: 16px; }
    }
    @media (hover: none) {
      .weather-card:hover, .hour-card:hover, .day:hover, .city-chip:hover, .theme-toggle:hover, .search button:hover { transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      .weather-card:hover, .hour-card:hover, .day:hover, .city-chip:hover, .theme-toggle:hover, .search button:hover { transform: none; }
      .logo-sun-rays, .logo-sun-disc, .logo-cloud, .weather-icon svg, .weather-icon svg circle { animation: none !important; }
      .weather-card.forecast-selected { animation: none; }
      .hour-card:hover .hour-icon svg, .hour-card:focus-visible .hour-icon svg, .day:hover .day-icon svg, .day:focus-visible .day-icon svg { transform: none; }
    }
  </style>
</head>
<body>
  <canvas id="weather-canvas" aria-hidden="true"></canvas>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none">
            <g class="logo-sun-rays" stroke="#fff9d8" stroke-width="2.1" stroke-linecap="round">
              <path d="M20 4v4M20 26v4M7 17h4m18 0h4M10.8 7.8l2.8 2.8m12.8 12.8 2.8 2.8m0-18.4-2.8 2.8M13.6 24.4l-2.8 2.8"/>
            </g>
            <circle class="logo-sun-disc" cx="20" cy="17" r="7" fill="#fff2bd"/>
            <path class="logo-cloud" d="M14 36h22a6.5 6.5 0 0 0 .5-13 10 10 0 0 0-18.7-1.3A7.8 7.8 0 0 0 14 36Z" fill="#fff"/>
          </svg>
        </span>
        <span>atmos</span>
      </div>
      <div class="topbar-actions">
        <span class="top-note">A little clearer, every day</span>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false" title="Switch to dark mode">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.7"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20.2 15.3A8.5 8.5 0 0 1 8.7 3.8 8.5 8.5 0 1 0 20.2 15.3Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>
    <nav class="weather-nav" aria-label="Weather sections">
      <a href="#current-weather" aria-current="location">Today</a>
      <a href="#hourly-section">Hourly</a>
      <a href="#forecast-section">5-day</a>
    </nav>

    <form class="search-wrap" id="search-form" role="search">
      <label class="sr-only" for="city-search">Search for a city</label>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="city-search" type="search" placeholder="Search a city…" value="Tokyo" autocomplete="off">
        <button id="search-button" type="submit">Search</button>
      </div>
    </form>
    <section class="city-picker" aria-label="Quick city search">
      <span class="city-picker-label">Quick cities</span>
      <div class="city-chips" id="preset-cities"></div>
      <div class="recent-city-section" id="recent-city-section" hidden>
        <span class="city-picker-label">Recently searched</span>
        <div class="city-chips recent-cities" id="recent-cities" aria-label="Recently searched cities"></div>
      </div>
    </section>
    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section class="weather-card" id="current-weather" aria-labelledby="city-name">
      <div class="place-row">
        <div>
          <p class="eyebrow" id="weather-heading-label">Current weather</p>
          <h1 id="city-name">Tokyo</h1>
          <div class="date" id="current-date"></div>
          <div class="date" id="current-context">Current conditions</div>
        </div>
        <span class="live-badge" id="data-badge">Live</span>
      </div>
      <div class="temperature-row">
        <div>
          <div class="temperature"><span id="current-temp">18</span><span class="degree">°</span></div>
          <div class="condition" id="current-condition">Partly cloudy</div>
        </div>
        <div class="weather-icon" id="current-icon" aria-hidden="true"></div>
      </div>
      <div class="wardrobe-tip" id="wardrobe-tip" role="note"></div>
      <div class="summary">
        <span>H: <strong id="today-high">21°</strong></span>
        <span>L: <strong id="today-low">14°</strong></span>
        <span>Wind now <strong id="wind-speed">12 km/h</strong></span>
      </div>
    </section>

    <div class="section-heading" id="hourly-section">
      <h2>Hourly Forecast</h2>
      <span>Next 24 hours</span>
    </div>
    <section class="hourly-forecast" id="hourly-forecast" aria-label="Hourly weather forecast for the next 24 hours"></section>

    <div class="section-heading" id="forecast-section">
      <h2>5-day forecast</h2>
      <span>Daily outlook</span>
    </div>
    <section class="forecast" id="forecast" aria-label="Five-day weather forecast"></section>
    <p class="footer">Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noreferrer">Open-Meteo</a></p>
  </main>

  <script>
    function localDateKey(date) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    }

    const fallback = {
      temperature: 18,
      code: 2,
      wind: 12,
      days: Array.from([
        { code: 2, high: 21, low: 14 },
        { code: 1, high: 22, low: 15 },
        { code: 3, high: 19, low: 13 },
        { code: 61, high: 17, low: 12 },
        { code: 1, high: 20, low: 13 }
      ], (day, offset) => {
        const date = new Date();
        date.setDate(date.getDate() + offset);
        return { ...day, date: localDateKey(date) };
      })
    };

    const weatherTypes = {
      0: ["Clear sky", "sun"], 1: ["Mainly clear", "sun"], 2: ["Partly cloudy", "partly"],
      3: ["Overcast", "cloud"], 45: ["Foggy", "fog"], 48: ["Rime fog", "fog"],
      51: ["Light drizzle", "rain"], 53: ["Drizzle", "rain"], 55: ["Heavy drizzle", "rain"],
      56: ["Freezing drizzle", "rain"], 57: ["Freezing drizzle", "rain"],
      61: ["Light rain", "rain"], 63: ["Rain", "rain"], 65: ["Heavy rain", "rain"],
      66: ["Freezing rain", "rain"], 67: ["Freezing rain", "rain"],
      71: ["Light snow", "snow"], 73: ["Snow", "snow"], 75: ["Heavy snow", "snow"], 77: ["Snow grains", "snow"],
      80: ["Rain showers", "rain"], 81: ["Rain showers", "rain"], 82: ["Heavy showers", "rain"],
      85: ["Snow showers", "snow"], 86: ["Snow showers", "snow"],
      95: ["Thunderstorm", "storm"], 96: ["Thunderstorm", "storm"], 99: ["Thunderstorm", "storm"]
    };
    function createFallbackHourly() {
      const start = new Date();
      start.setMinutes(0, 0, 0);
      return Array.from({ length: 24 }, (_, index) => {
        const time = new Date(start);
        time.setHours(start.getHours() + index);
        const hour = time.getHours();
        const daylight = Math.max(0, Math.sin(((hour - 6) / 12) * Math.PI));
        return {
          time: `${time.getFullYear()}-${String(time.getMonth() + 1).padStart(2, "0")}-${String(time.getDate()).padStart(2, "0")}T${String(hour).padStart(2, "0")}:00`,
          temperature: Math.round(14 + daylight * 7 + Math.sin(index / 3) * 2),
          code: [2, 1, 1, 2, 3, 2, 1, 2][index % 8]
        };
      });
    }
    fallback.hourly = createFallbackHourly();
    const icons = {
      sun: '<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="12" fill="currentColor"/><g stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="M32 5v7m0 40v7M5 32h7m40 0h7M12.9 12.9l5 5m28.2 28.2 5 5m0-38.2-5 5M17.9 46.1l-5 5"/></g></svg>',
      partly: '<svg viewBox="0 0 64 64" fill="none"><circle cx="39" cy="22" r="10" fill="currentColor"/><path d="M17 46h30a9 9 0 0 0 1-18 14 14 0 0 0-26-1 10 10 0 0 0-5 19Z" fill="currentColor" opacity=".82"/></svg>',
      cloud: '<svg viewBox="0 0 64 64" fill="none"><path d="M16 47h32a10 10 0 0 0 1-20 15 15 0 0 0-28-1 11 11 0 0 0-5 21Z" fill="currentColor" opacity=".82"/></svg>',
      rain: '<svg viewBox="0 0 64 64" fill="none"><path d="M15 38h34a9 9 0 0 0 1-18 14 14 0 0 0-26-1 10 10 0 0 0-9 19Z" fill="currentColor" opacity=".72"/><g stroke="#a9c8e2" stroke-width="3" stroke-linecap="round"><path d="m23 45-3 7m14-7-3 7m14-7-3 7"/></g></svg>',
      snow: '<svg viewBox="0 0 64 64" fill="none"><path d="M15 36h34a9 9 0 0 0 1-18 14 14 0 0 0-26-1 10 10 0 0 0-9 19Z" fill="currentColor" opacity=".72"/><g fill="#b8d3e6"><circle cx="22" cy="46" r="2.5"/><circle cx="33" cy="51" r="2.5"/><circle cx="44" cy="45" r="2.5"/></g></svg>',
      fog: '<svg viewBox="0 0 64 64" fill="none"><path d="M18 30h28a9 9 0 0 0 1-18 14 14 0 0 0-26-1 10 10 0 0 0-3 19Z" fill="currentColor" opacity=".66"/><g stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M10 39h44M15 47h34M22 55h20"/></g></svg>',
      storm: '<svg viewBox="0 0 64 64" fill="none"><path d="M15 35h34a9 9 0 0 0 1-18 14 14 0 0 0-26-1 10 10 0 0 0-9 19Z" fill="currentColor" opacity=".72"/><path d="m34 34-9 14h8l-3 11 13-17h-9l5-8" fill="#e7c98f"/></svg>'
    };
    const $ = (selector) => document.querySelector(selector);
    const form = $("#search-form");
    const input = $("#city-search");
    const button = $("#search-button");
    const status = $("#status");
    const themeToggle = $("#theme-toggle");
    const weatherNav = $(".weather-nav");
    const navLinks = [...weatherNav.querySelectorAll("a")];
    const hourlyForecast = $("#hourly-forecast");
    const dailyForecast = $("#forecast");
    let activeWeatherData = null;
    let activeIsFallback = false;
    const presetCities = ["Tokyo", "London", "New York", "Paris"];
    const recentCitiesKey = "atmos-recent-cities";
    let recentCities = [];
    try {
      const savedCities = JSON.parse(localStorage.getItem(recentCitiesKey) || "[]");
      if (Array.isArray(savedCities)) {
        recentCities = savedCities.filter((city) => typeof city === "string").slice(0, 5);
      }
    } catch (error) {
      console.warn("Unable to load saved Atmos cities.", error);
    }

    function renderCityChips() {
      $("#preset-cities").replaceChildren(...presetCities.map((city) => createCityChip(city)));
      const recentContainer = $("#recent-cities");
      recentContainer.replaceChildren(...recentCities.map((city) => createCityChip(city)));
      $("#recent-city-section").hidden = recentCities.length === 0;
      recentContainer.setAttribute("aria-label", recentCities.length ? `Recently searched: ${recentCities.join(", ")}` : "Recently searched cities");
    }

    function createCityChip(city) {
      const chip = document.createElement("button");
      chip.className = "city-chip";
      chip.type = "button";
      chip.textContent = city;
      chip.setAttribute("aria-label", `Show weather for ${city}`);
      chip.addEventListener("click", () => {
        input.value = city;
        form.requestSubmit();
      });
      return chip;
    }

    function rememberCity(city) {
      recentCities = [city, ...recentCities.filter((savedCity) => savedCity.toLowerCase() !== city.toLowerCase())].slice(0, 5);
      renderCityChips();
      try {
        localStorage.setItem(recentCitiesKey, JSON.stringify(recentCities));
      } catch (error) {
        console.warn("Unable to save Atmos recent cities.", error);
      }
    }

    renderCityChips();

    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;
      const nextTheme = theme === "dark" ? "light" : "dark";
      themeToggle.setAttribute("aria-label", `Switch to ${nextTheme} mode`);
      themeToggle.setAttribute("title", `Switch to ${nextTheme} mode`);
      themeToggle.setAttribute("aria-pressed", String(theme === "dark"));
      document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#111a27" : "#f3f6fb";
    }

    const systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    themeToggle.setAttribute("aria-label", `Switch to ${systemPrefersDark ? "light" : "dark"} mode`);
    themeToggle.setAttribute("title", `Switch to ${systemPrefersDark ? "light" : "dark"} mode`);
    themeToggle.setAttribute("aria-pressed", String(systemPrefersDark));
    themeToggle.addEventListener("click", () => {
      const isDark = document.documentElement.dataset.theme === "dark"
        || (!document.documentElement.dataset.theme && window.matchMedia("(prefers-color-scheme: dark)").matches);
      setTheme(isDark ? "light" : "dark");
    });

    function describe(code) {
      return weatherTypes[code] || ["Variable conditions", "partly"];
    }

    function applyNavbarTemperature(temperature) {
      const stops = [
        { temperature: -10, hue: 218 },
        { temperature: 0, hue: 204 },
        { temperature: 12, hue: 174 },
        { temperature: 22, hue: 42 },
        { temperature: 32, hue: 20 },
        { temperature: 40, hue: 8 }
      ];
      const boundedTemperature = Math.max(stops[0].temperature, Math.min(stops[stops.length - 1].temperature, temperature));
      const upperIndex = stops.findIndex((stop) => stop.temperature >= boundedTemperature);
      const lower = stops[Math.max(0, upperIndex - 1)];
      const upper = stops[Math.max(0, upperIndex)];
      const fraction = upper.temperature === lower.temperature
        ? 0
        : (boundedTemperature - lower.temperature) / (upper.temperature - lower.temperature);
      const hue = Math.round(lower.hue + (upper.hue - lower.hue) * fraction);
      document.documentElement.style.setProperty("--nav-hue", hue);
    }

    const visibleSections = new Map();
    const sectionObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => visibleSections.set(entry.target.id, entry.isIntersecting ? entry.intersectionRatio : 0));
      const mostVisible = [...visibleSections.entries()].sort((first, second) => second[1] - first[1])[0];
      const activeSection = mostVisible && mostVisible[1] > 0 ? mostVisible[0] : "current-weather";
      navLinks.forEach((link) => {
        if (link.hash === `#${activeSection}`) link.setAttribute("aria-current", "location");
        else link.removeAttribute("aria-current");
      });
    }, { rootMargin: "-18% 0px -62% 0px", threshold: [0, .2, .4, .6, .8, 1] });
    ["current-weather", "hourly-section", "forecast-section"].forEach((sectionId) => {
      sectionObserver.observe(document.getElementById(sectionId));
    });

    function lifestyleTip(temperature, code) {
      if ([56, 57, 66, 67, 71, 73, 75, 77, 85, 86].includes(code) || temperature <= 2) {
        return ["🧥", "Heavy coat & warm layers"];
      }
      if ([51, 53, 55, 61, 63, 65, 80, 81, 82, 95, 96, 99].includes(code)) {
        return ["☔", "Pack an umbrella today"];
      }
      if (temperature >= 27 && [0, 1, 2, 3].includes(code)) {
        return ["😎", "Sunscreen & t-shirt weather"];
      }
      if (temperature >= 20) return ["🌤️", "Light layers should feel just right"];
      if (temperature <= 10) return ["🧣", "A warm layer will keep you cozy"];
      return ["🧥", "A light jacket is a good idea"];
    }

    function formatDate(date) {
      return new Intl.DateTimeFormat(undefined, { weekday: "short" }).format(date);
    }

    function dateFromApiDate(dateText, timeText = "12:00") {
      const [year, month, day] = dateText.split("-").map(Number);
      const [hour, minute] = timeText.split(":").map(Number);
      return new Date(year, month - 1, day, hour, minute);
    }

    function formatApiDate(dateText, timeText) {
      return new Intl.DateTimeFormat(undefined, {
        weekday: "long", month: "long", day: "numeric"
      }).format(dateFromApiDate(dateText, timeText));
    }

    function formatHourLabel(timeText) {
      const [hourText, minuteText] = timeText.split(":");
      return new Intl.DateTimeFormat(undefined, {
        hour: "numeric",
        minute: minuteText === "00" ? undefined : "2-digit"
      }).format(dateFromApiDate("2020-01-01", timeText));
    }

    function applyTemperaturePalette(temperature) {
      const stops = [
          { temperature: -10, hue: 211, saturation: 38, lightness: 76 },
          { temperature: 0, hue: 198, saturation: 38, lightness: 73 },
          { temperature: 12, hue: 169, saturation: 32, lightness: 66 },
          { temperature: 22, hue: 39, saturation: 42, lightness: 76 },
          { temperature: 32, hue: 17, saturation: 43, lightness: 76 },
          { temperature: 40, hue: 0, saturation: 40, lightness: 77 }
      ];
      const boundedTemperature = Math.max(stops[0].temperature, Math.min(stops[stops.length - 1].temperature, temperature));
      const upperIndex = stops.findIndex((stop) => stop.temperature >= boundedTemperature);
      const lower = stops[Math.max(0, upperIndex - 1)];
      const upper = stops[Math.max(0, upperIndex)];
      const fraction = upper.temperature === lower.temperature
        ? 0
        : (boundedTemperature - lower.temperature) / (upper.temperature - lower.temperature);
      const hue = Math.round(lower.hue + (upper.hue - lower.hue) * fraction);
      const saturation = Math.round(lower.saturation + (upper.saturation - lower.saturation) * fraction);
      const lightness = Math.round(lower.lightness + (upper.lightness - lower.lightness) * fraction);
      const root = document.documentElement;
      root.style.setProperty("--accent", `hsl(${hue} ${saturation}% ${lightness}%)`);
      root.style.setProperty("--weather-ambient", `hsla(${hue} ${saturation}% ${lightness}%, .12)`);
      root.style.setProperty("--weather-glow", `hsla(${hue} ${saturation}% ${lightness}%, .25)`);
    }

    function displayConditions({ temperature, code, dateText, context, badge, high, low, heading }) {
      applyTemperaturePalette(temperature);
      applyNavbarTemperature(temperature);
      setWeatherParticles(code);
      $("#current-date").textContent = dateText;
      $("#current-context").textContent = context;
      $("#weather-heading-label").textContent = heading;
      $("#current-temp").textContent = Math.round(temperature);
      $("#current-condition").textContent = describe(code)[0];
      const currentIcon = $("#current-icon");
      const iconType = describe(code)[1];
      currentIcon.className = `weather-icon ${iconType}`;
      currentIcon.innerHTML = icons[iconType];
      const [tipIcon, tipText] = lifestyleTip(temperature, code);
      $("#wardrobe-tip").innerHTML = `<span class="wardrobe-tip-icon" aria-hidden="true">${tipIcon}</span><span>${tipText}</span>`;
      $("#today-high").textContent = `${Math.round(high)}°`;
      $("#today-low").textContent = `${Math.round(low)}°`;
      $("#data-badge").textContent = badge;
    }

    function renderDailyForecast() {
      dailyForecast.innerHTML = activeWeatherData.days.map((day, index) => {
        const [label, icon] = describe(day.code);
        const date = dateFromApiDate(day.date);
        const dayName = index === 0 ? "Today" : formatDate(date);
        return `<button class="day" type="button" data-index="${index}" aria-pressed="false" aria-label="Show ${dayName} forecast: ${label}, high ${Math.round(day.high)} degrees, low ${Math.round(day.low)} degrees">
          <span class="day-name">${dayName}</span>
          <span class="day-icon" aria-hidden="true">${icons[icon]}</span>
          <span class="day-temps"><span>${Math.round(day.high)}°</span><span class="low">${Math.round(day.low)}°</span></span>
          <span class="day-condition">${label}</span>
        </button>`;
      }).join("");
    }

    function renderHourlyForecast() {
      hourlyForecast.innerHTML = activeWeatherData.hourly.map((hour, index) => {
        const [label, icon] = describe(hour.code);
        const time = hour.time.slice(11, 16);
        const timeLabel = index === 0 ? "Now" : formatHourLabel(time);
        return `<button class="hour-card" type="button" data-index="${index}" aria-pressed="false" aria-label="Show ${timeLabel} forecast: ${label}, ${Math.round(hour.temperature)} degrees">
          <span class="hour-time">${timeLabel}</span>
          <span class="hour-icon" aria-hidden="true">${icons[icon]}</span>
          <span class="hour-temp">${Math.round(hour.temperature)}°</span>
        </button>`;
      }).join("");
    }

    function selectHourlyForecast(index) {
      const hour = activeWeatherData.hourly[index];
      if (!hour) return;
      const [datePart, timePart] = hour.time.split("T");
      const forecastDay = activeWeatherData.days.find((day) => day.date === datePart) || activeWeatherData.days[0];
      const timeLabel = formatHourLabel(timePart);
      displayConditions({
        temperature: hour.temperature,
        code: hour.code,
        dateText: formatApiDate(datePart, timePart),
        context: `Hourly forecast · ${timeLabel}`,
        badge: activeIsFallback ? "Sample" : "Forecast",
        high: forecastDay.high,
        low: forecastDay.low,
        heading: "Hourly forecast"
      });
      revealWeatherDetails();
      hourlyForecast.querySelectorAll(".hour-card").forEach((card, cardIndex) => {
        card.setAttribute("aria-pressed", String(cardIndex === index));
      });
      dailyForecast.querySelectorAll(".day").forEach((card) => card.setAttribute("aria-pressed", "false"));
    }

    function selectDailyForecast(index) {
      const day = activeWeatherData.days[index];
      if (!day) return;
      const dateText = formatApiDate(day.date);
      displayConditions({
        temperature: day.high,
        code: day.code,
        dateText,
        context: "Daily outlook · Forecast high",
        badge: activeIsFallback ? "Sample" : "Forecast",
        high: day.high,
        low: day.low,
        heading: "Daily forecast"
      });
      revealWeatherDetails();
      dailyForecast.querySelectorAll(".day").forEach((card, cardIndex) => {
        card.setAttribute("aria-pressed", String(cardIndex === index));
      });
      hourlyForecast.querySelectorAll(".hour-card").forEach((card) => card.setAttribute("aria-pressed", "false"));
    }

    function revealWeatherDetails() {
      const weatherCard = $("#current-weather");
      weatherCard.classList.remove("forecast-selected");
      void weatherCard.offsetWidth;
      weatherCard.classList.add("forecast-selected");
      const bounds = weatherCard.getBoundingClientRect();
      if (bounds.top < 82 || bounds.bottom > window.innerHeight) {
        weatherCard.scrollIntoView({ behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
      }
    }

    hourlyForecast.addEventListener("click", (event) => {
      const card = event.target.closest(".hour-card");
      if (card) selectHourlyForecast(Number(card.dataset.index));
    });

    dailyForecast.addEventListener("click", (event) => {
      const card = event.target.closest(".day");
      if (card) selectDailyForecast(Number(card.dataset.index));
    });

    function updateWeather(city, data, isFallback) {
      activeWeatherData = data;
      activeIsFallback = isFallback;
      $("#city-name").textContent = city;
      displayConditions({
        temperature: data.temperature,
        code: data.code,
        dateText: new Intl.DateTimeFormat(undefined, {
          weekday: "long", month: "long", day: "numeric"
        }).format(new Date()),
        context: "Current conditions",
        badge: isFallback ? "Sample" : "Live",
        high: data.days[0].high,
        low: data.days[0].low,
        heading: "Current weather"
      });
      $("#wind-speed").textContent = `${Math.round(data.wind)} km/h`;
      renderDailyForecast();
      renderHourlyForecast();
    }

    async function fetchWeather(city) {
      const geocodeUrl = new URL("https://geocoding-api.open-meteo.com/v1/search");
      geocodeUrl.search = new URLSearchParams({ name: city, count: "1", language: "en", format: "json" });
      const locationResponse = await fetch(geocodeUrl);
      if (!locationResponse.ok) throw new Error("City lookup is temporarily unavailable.");
      const location = (await locationResponse.json()).results?.[0];
      if (!location) throw new Error(`Couldn't find “${city}”.`);

      const forecastUrl = new URL("https://api.open-meteo.com/v1/forecast");
      forecastUrl.search = new URLSearchParams({
        latitude: location.latitude,
        longitude: location.longitude,
        current: "temperature_2m,weather_code,wind_speed_10m",
        hourly: "temperature_2m,weather_code",
        forecast_hours: "24",
        daily: "weather_code,temperature_2m_max,temperature_2m_min",
        forecast_days: "5",
        timezone: "auto"
      });
      const forecastResponse = await fetch(forecastUrl);
      if (!forecastResponse.ok) throw new Error("Weather data is temporarily unavailable.");
      const result = await forecastResponse.json();
      const days = result.daily.time.map((date, index) => ({
        date,
        code: result.daily.weather_code[index],
        high: result.daily.temperature_2m_max[index],
        low: result.daily.temperature_2m_min[index]
      }));
      const hourly = result.hourly.time.map((time, index) => ({
        time,
        temperature: result.hourly.temperature_2m[index],
        code: result.hourly.weather_code[index]
      }));
      return {
        city: [location.name, location.admin1, location.country].filter(Boolean).filter((part, index, parts) => parts.indexOf(part) === index).join(", "),
        data: {
          temperature: result.current.temperature_2m,
          code: result.current.weather_code,
          wind: result.current.wind_speed_10m,
          days,
          hourly
        }
      };
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const city = input.value.trim();
      if (!city) {
        input.focus();
        status.textContent = "Enter a city to see its forecast.";
        status.className = "status error";
        return;
      }
      button.disabled = true;
      status.textContent = `Finding the forecast for ${city}…`;
      status.className = "status";
      try {
        const result = await fetchWeather(city);
        updateWeather(result.city, result.data, false);
        input.value = result.city.split(",")[0];
        rememberCity(result.city.split(",")[0]);
        status.textContent = "";
      } catch (error) {
        updateWeather(city, fallback, true);
        status.textContent = `${error.message} Showing sample weather.`;
        status.className = "status error";
      } finally {
        button.disabled = false;
      }
    });

    const weatherCanvas = $("#weather-canvas");
    const weatherContext = weatherCanvas.getContext("2d");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    let canvasWidth = 0;
    let canvasHeight = 0;
    let canvasScale = 1;
    let particleType = "dust";
    let particles = [];
    let animationFrame = 0;
    let previousFrameTime = 0;

    function resizeWeatherCanvas() {
      canvasWidth = window.innerWidth;
      canvasHeight = window.innerHeight;
      canvasScale = Math.min(window.devicePixelRatio || 1, 1.5);
      weatherCanvas.width = Math.round(canvasWidth * canvasScale);
      weatherCanvas.height = Math.round(canvasHeight * canvasScale);
      weatherContext.setTransform(canvasScale, 0, 0, canvasScale, 0, 0);
      createWeatherParticles();
      drawWeatherParticles(0);
    }

    function createWeatherParticles() {
      const count = particleType === "rain" ? 72 : particleType === "snow" ? 48 : particleType === "dust" ? 38 : 0;
      particles = Array.from({ length: count }, () => ({
        x: Math.random() * canvasWidth,
        y: Math.random() * canvasHeight,
        size: particleType === "rain" ? 8 + Math.random() * 13 : 1 + Math.random() * (particleType === "snow" ? 3 : 2),
        speed: particleType === "rain" ? 260 + Math.random() * 330 : particleType === "snow" ? 14 + Math.random() * 27 : 4 + Math.random() * 12,
        opacity: .12 + Math.random() * .35,
        drift: (Math.random() - .5) * (particleType === "snow" ? 24 : 8),
        phase: Math.random() * Math.PI * 2
      }));
    }

    function drawWeatherParticles(deltaSeconds) {
      weatherContext.clearRect(0, 0, canvasWidth, canvasHeight);
      const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#d7a2b4";
      const particleColor = particleType === "rain"
        ? "168, 198, 226"
        : particleType === "snow" ? "225, 236, 247" : accent;
      particles.forEach((particle) => {
        if (particleType === "rain") {
          particle.y += particle.speed * deltaSeconds;
          particle.x += particle.drift * deltaSeconds;
          if (particle.y > canvasHeight + 20) {
            particle.y = -20;
            particle.x = Math.random() * canvasWidth;
          }
          weatherContext.strokeStyle = `rgba(${particleColor}, ${particle.opacity * .65})`;
          weatherContext.lineWidth = 1;
          weatherContext.beginPath();
          weatherContext.moveTo(particle.x, particle.y);
          weatherContext.lineTo(particle.x - 3, particle.y + particle.size);
          weatherContext.stroke();
        } else {
          if (particleType === "snow") {
            particle.y += particle.speed * deltaSeconds;
            particle.x += (particle.drift + Math.sin(particle.phase + particle.y / 55) * 8) * deltaSeconds;
          } else {
            particle.y -= particle.speed * deltaSeconds;
            particle.x += (particle.drift + Math.sin(particle.phase + particle.y / 85) * 5) * deltaSeconds;
          }
          if (particle.y > canvasHeight + 8) particle.y = -8;
          if (particle.y < -8) particle.y = canvasHeight + 8;
          if (particle.x > canvasWidth + 8) particle.x = -8;
          if (particle.x < -8) particle.x = canvasWidth + 8;
          weatherContext.globalAlpha = particle.opacity;
          weatherContext.fillStyle = particleType === "snow" ? `rgba(${particleColor}, 1)` : accent;
          weatherContext.beginPath();
          weatherContext.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
          weatherContext.fill();
          weatherContext.globalAlpha = 1;
        }
      });
    }

    function animateWeather(timestamp) {
      if (!previousFrameTime) previousFrameTime = timestamp;
      const deltaSeconds = Math.min((timestamp - previousFrameTime) / 1000, .04);
      previousFrameTime = timestamp;
      drawWeatherParticles(deltaSeconds);
      animationFrame = window.requestAnimationFrame(animateWeather);
    }

    function setWeatherParticles(code) {
      if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82) || code >= 95) {
        particleType = "rain";
      } else if ((code >= 71 && code <= 77) || (code >= 85 && code <= 86)) {
        particleType = "snow";
      } else if (code <= 2) {
        particleType = "dust";
      } else {
        particleType = "none";
      }
      createWeatherParticles();
      if (animationFrame) {
        window.cancelAnimationFrame(animationFrame);
        animationFrame = 0;
      }
      previousFrameTime = 0;
      drawWeatherParticles(0);
      if (!reducedMotion.matches && particles.length) animationFrame = window.requestAnimationFrame(animateWeather);
    }

    window.addEventListener("resize", resizeWeatherCanvas, { passive: true });
    reducedMotion.addEventListener("change", () => {
      if (reducedMotion.matches) {
        window.cancelAnimationFrame(animationFrame);
        animationFrame = 0;
        drawWeatherParticles(0);
      } else if (!animationFrame && particles.length) {
        previousFrameTime = 0;
        animationFrame = window.requestAnimationFrame(animateWeather);
      }
    });
    resizeWeatherCanvas();
    updateWeather("Tokyo", fallback, true);
    form.requestSubmit();
  </script>
</body>
</html>
